    }

    .check {

      height: 58px;
      display: grid;

      background: var(--leaf);
      color: var(--pine);

      font-weight: 900;
    }

      color: var(--pine);
      font-size: clamp(2.1rem, 7vw, 3.7rem);
      line-height: 1.02;
      letter-spacing: 0;
    }

    p {
      max-width: 540px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 1px solid var(--pine);
      border-radius: 6px;
      background: var(--pine);
      color: var(--white);
      font-weight: 850;
      text-decoration: none;
    }

    .button.secondary {
      background: var(--white);
      color: var(--pine);
    }

    footer {
      padding: 22px 16px;
      text-align: center;
    }

    footer p {
      margin: 0 auto;
      color: rgba(255, 255, 255, 0.76);
      font-size: 0.88rem;
    }

    @media (max-width: 520px) {
